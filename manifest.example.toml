# source-fetch manifest — annotated example
#
# One table per dependency, under [source.<name>]. Save as `.source-fetch.toml`
# in your project root (auto-discovered by walking upward from $PWD), or point
# $SOURCE_FETCH_MANIFEST at it.
#
# Optional top-level key: where the checkouts live. Relative paths are
# resolved against the project root. Inside a git repository the default is
# the project-local `.source-fetch/`; outside one it is the user cache
# directory.
# cache_dir = ".source-fetch"

# A version-matched CLI tool: the checkout is pinned to the tag v<installed>.
[source.chezmoi]
url = "https://github.com/twpayne/chezmoi.git"
version_cmd = "chezmoi --version"
tag_prefix = "v"

# A frontend project's formatter and linter, installed with
# `pnpm add -D -E @biomejs/biome`. Run source-fetch from the project root
# to resolve the local Biome version to its @biomejs/biome@<version> tag.
[source.biome]
url = "https://github.com/biomejs/biome.git"
version_cmd = "pnpm exec biome --version"
tag_prefix = "@biomejs/biome@"

# A persistent pin: `ref` always wins over version detection.
[source.pinned-tool]
url = "https://github.com/example/pinned-tool.git"
ref = "v1.2.3"

# No version detection: `default_ref` is used, else the default branch.
[source.bazzite]
url = "https://github.com/ublue-os/bazzite.git"
default_ref = "stable"

# Minimal entry: always the default branch.
[source.some-library]
url = "https://github.com/example/some-library.git"
