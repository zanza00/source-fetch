version: 2

builds:
  - id: source-fetch
    main: ./cmd/source-fetch
    binary: source-fetch
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/zanza00/source-fetch/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

publishers:
  - name: homebrew-tap
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    cmd: python3 scripts/publish-homebrew.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - GH_TOKEN={{ .Env.HOMEBREW_TAP_TOKEN }}

changelog:
  sort: asc
